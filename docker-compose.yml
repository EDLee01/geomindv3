# GeoMind 4.0 Docker Compose 配置
# 使用方法: docker compose up -d

services:
  geomind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geomind
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM API Keys（至少配置一个）
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_ZEABUR_API_KEY=${CLAUDE_ZEABUR_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - KIMI_ZEABUR_API_KEY=${KIMI_ZEABUR_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 文献检索（Qdrant）
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-geomind_papers}
      # 用户认证（可选）
      - CHAINLIT_AUTH_SECRET=${CHAINLIT_AUTH_SECRET:-}
      - GEOMIND_USERS=${GEOMIND_USERS:-}
    volumes:
      # 持久化数据（可选）
      - geomind_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  geomind_data:
